<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ᴅɪɢɪᴛᴀʟ.ɢʜᴏsᴛ</title>

  <link rel="icon" type="image/png" href="assets/header.png?v=4">
  <link rel="shortcut icon" type="image/png" href="assets/header.png?v=4">
  <link rel="apple-touch-icon" href="assets/header.png?v=4">

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Share+Tech+Mono&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/4b9ba14b0f.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="bg"></div>

  <main class="page">
    <section class="profile-card">
      <div class="top-row">
        <div class="avatar-wrap">
          <div class="decoration"></div>
          <img class="avatar" src="assets/avatar.jpg" alt="Discord profile picture" />
        </div>

        <div class="name-block">
          <h1 class="ghost-name">𝔤𝔥𝔬𝔰𝔱</h1>
          <div class="handle-row">
            <span>@digital.gh0st</span>
            <span class="server-badge">.XIII.</span>
          </div>
        </div>
      </div>

      <p class="center-line">
        <span id="typingLine"></span><span class="typing-cursor">|</span>
      </p>

      <div class="badges">
        <span>SHE/HER</span>
        <span>30+</span>
        <span>XIII CREATOR</span>
      </div>

      <nav class="links" aria-label="social links">
        <a href="https://steamcommunity.com/" target="_blank" rel="noopener noreferrer" aria-label="Steam"><i class="fa-brands fa-steam"></i></a>
        <a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://discord.gg/thirteen-xiii" target="_blank" rel="noopener noreferrer" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://throne.com/" target="_blank" rel="noopener noreferrer" aria-label="Throne"><i class="fa-solid fa-crown"></i></a>
      </nav>

      <section class="server-card">
        <img src="assets/XIII.gif" alt="XIII server icon" />
        <div class="server-info">
          <h2>.XIII. <span>21+</span></h2>
          <p><span class="online"></span>49 ONLINE <span class="divider"></span> 233 MEMBERS</p>
        </div>
        <a class="join" href="https://discord.gg/thirteen-xiii" target="_blank" rel="noopener noreferrer">JOIN</a>
      </section>

      <section class="music-player custom-player">
        <div class="cover" id="coverArt" aria-hidden="true"></div>

        <div class="track">
          <div class="track-title" id="trackTitle">MODEL CITIZEN — MALE TEARS</div>

          <div class="player-controls">
            <button class="player-btn" id="prevBtn" type="button" aria-label="Previous song">‹‹</button>
            <button class="player-btn main-play" id="playBtn" type="button" aria-label="Play music">▶</button>
            <button class="player-btn" id="nextBtn" type="button" aria-label="Next song">››</button>

            <span class="time" id="currentTime">0:00</span>
            <input class="progress" id="progressBar" type="range" min="0" max="100" value="0" aria-label="Song progress" />
            <span class="time" id="duration">0:00</span>
          </div>

          <audio id="song" preload="metadata"></audio>
        </div>
      </section>
    </section>
  </main>

  <script>
    const phrases = [
      "WIFE · MOTHER · SPOOKY",
      "ARCHIVING THE STRANGE"
    ];

    const target = document.getElementById("typingLine");
    let phraseIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function typeLoop() {
      const currentPhrase = phrases[phraseIndex];

      if (!deleting) {
        target.textContent = currentPhrase.substring(0, charIndex);
        charIndex++;

        if (charIndex > currentPhrase.length) {
          deleting = true;
          setTimeout(typeLoop, 2000);
          return;
        }
      } else {
        target.textContent = currentPhrase.substring(0, charIndex);
        charIndex--;

        if (charIndex < 0) {
          deleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          setTimeout(typeLoop, 400);
          return;
        }
      }

      setTimeout(typeLoop, deleting ? 45 : 100);
    }

    typeLoop();
  </script>

  <script>
    const playlist = [
      {
        title: "MODEL CITIZEN — MALE TEARS",
        file: "assets/Model Citizen - Male Tears.mp3",
        cover: "assets/model citizen art.jpg"
      },
      {
        title: "MONOCHROME — BLCKBRD, SALIVA GREY",
        file: "assets/MONOCHROME - Blckbrd, Saliva Grey.mp3",
        cover: "assets/monochrome art.jpg"
      },
      {
        title: "MOONCHILD — FIELDS OF THE NEPHILIM",
        file: "assets/Moonchild - Fields Of The Nephilim.mp3",
        cover: "assets/moonchild art.jpg"
      }
    ];

    const song = document.getElementById("song");
    const playBtn = document.getElementById("playBtn");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const trackTitle = document.getElementById("trackTitle");
    const coverArt = document.getElementById("coverArt");

    let currentTrack = 0;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function loadTrack(index, autoplay = false) {
      currentTrack = index;
      song.src = playlist[currentTrack].file;
      trackTitle.textContent = playlist[currentTrack].title;
      coverArt.style.backgroundImage = `url('${playlist[currentTrack].cover}')`;
      progressBar.value = 0;
      progressBar.style.setProperty("--progress", "0%");
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";
      playBtn.textContent = "▶";

      if (autoplay) {
        song.play();
        playBtn.textContent = "❚❚";
      }
    }

    playBtn.addEventListener("click", () => {
      if (song.paused) {
        song.play();
        playBtn.textContent = "❚❚";
      } else {
        song.pause();
        playBtn.textContent = "▶";
      }
    });

    nextBtn.addEventListener("click", () => {
      loadTrack((currentTrack + 1) % playlist.length, true);
    });

    prevBtn.addEventListener("click", () => {
      loadTrack((currentTrack - 1 + playlist.length) % playlist.length, true);
    });

    song.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(song.duration);
    });

    song.addEventListener("timeupdate", () => {
      const percent = (song.currentTime / song.duration) * 100 || 0;
      progressBar.value = percent;
      progressBar.style.setProperty("--progress", `${percent}%`);
      currentTimeEl.textContent = formatTime(song.currentTime);
    });

    progressBar.addEventListener("input", () => {
      if (!song.duration) return;
      song.currentTime = (progressBar.value / 100) * song.duration;
      progressBar.style.setProperty("--progress", `${progressBar.value}%`);
    });

    song.addEventListener("ended", () => {
      loadTrack((currentTrack + 1) % playlist.length, true);
    });

    loadTrack(0);
  </script>
</body>
</html>
