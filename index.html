  <script>
    const typingPhrases = [
      "WIFE · MOTHER · SPOOKY",
      "ARCHIVING THE STRANGE"
    ];

    const typingTarget = document.getElementById("typingLine");
    let typingPhraseIndex = 0;
    let typingCharIndex = 0;
    let deleting = false;

    function typeLoop() {

  if (typingTarget.dataset.glitchPaused === "true") {

    setTimeout(typeLoop, 100);

    return;

  }

  const phrase = typingPhrases[typingPhraseIndex];

  if (!deleting) {
        typingTarget.textContent = phrase.substring(0, typingCharIndex);
        typingCharIndex++;

        if (typingCharIndex > phrase.length) {
          deleting = true;
          setTimeout(typeLoop, 2000);
          return;
        }
      } else {
        typingTarget.textContent = phrase.substring(0, typingCharIndex);
        typingCharIndex--;

        if (typingCharIndex < 0) {
          deleting = false;
          typingPhraseIndex = (typingPhraseIndex + 1) % typingPhrases.length;
          setTimeout(typeLoop, 450);
          return;
        }
      }

      setTimeout(typeLoop, deleting ? 45 : 100);
    }

    typeLoop();
  </script>

  <script>
const glitchChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&!?/*+-";
const badgeEls = document.querySelectorAll(".badges span");

badgeEls.forEach((badge) => {
  badge.dataset.original = badge.textContent;
});

function glitchAllBadges() {
  let frame = 0;
  const maxFrames = 25;

  const interval = setInterval(() => {
    badgeEls.forEach((badge) => {
      const original = badge.dataset.original;

      badge.textContent = original
        .split("")
        .map((char) => {
          if (char === " ") return char;
          return Math.random() > 0.45
            ? glitchChars[Math.floor(Math.random() * glitchChars.length)]
            : char;
        })
        .join("");
    });

    frame++;

    if (frame >= maxFrames) {
      clearInterval(interval);
      badgeEls.forEach((badge) => {
        badge.textContent = badge.dataset.original;
      });
    }
  }, 45);
}

function glitchAllText() {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&!?/*+-";

  const textEls = document.querySelectorAll(
    ".ghost-name, .handle-row, .badges span, .server-info h2, .server-stat-text, .track-title, .join"
  );

  textEls.forEach((el) => {
    el.dataset.original = el.dataset.original || el.textContent;
  });

  let frame = 0;

  const scramble = setInterval(() => {
    textEls.forEach((el) => {
      const original = el.dataset.original;

      el.textContent = original
        .split("")
        .map((char) => {
          if (char === " ") return char;
          return Math.random() > 0.45
            ? chars[Math.floor(Math.random() * chars.length)]
            : char;
        })
        .join("");
    });

    frame++;

    if (frame >= 10) {
      clearInterval(scramble);
      textEls.forEach((el) => {
        el.textContent = el.dataset.original;
      });
    }
  }, 45);
}
</script>

  <script>
  const song = {

    let currentTrack = 0;

    const audio = document.getElementById("audioPlayer");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const trackTitle = document.getElementById("trackTitle");
    const songCover = document.getElementById("songCover");

    function formatTime(seconds) {
      if (!seconds || Number.isNaN(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${min}:${sec}`;
    }

    function loadTrack(index) {
      const track = playlist[index];
      audio.src = track.file;
      trackTitle.textContent = track.title;
      songCover.src = track.cover;
      progressBar.value = 0;
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";
      playBtn.textContent = "▶";
    }

    function playTrack() {
      audio.play();
      playBtn.textContent = "❚❚";
    }

    function pauseTrack() {
      audio.pause();
      playBtn.textContent = "▶";
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        playTrack();
      } else {
        pauseTrack();
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      progressBar.value = (audio.currentTime / audio.duration) * 100 || 0;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    progressBar.addEventListener("input", () => {
      audio.currentTime = (progressBar.value / 100) * audio.duration;
    });

    audio.addEventListener("ended", () => {
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      playTrack();
    });
  </script>
  
<script>
let lastBadgeIndex = -1;

function glitchRandomBadge() {
  const badges = document.querySelectorAll(".badges span");
  if (!badges.length) return;

  let randomIndex;

  do {
    randomIndex = Math.floor(Math.random() * badges.length);
  } while (badges.length > 1 && randomIndex === lastBadgeIndex);

  lastBadgeIndex = randomIndex;

  const badge = badges[randomIndex];
  const original = badge.dataset.original || badge.textContent;
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&!?/*+-";

  badge.style.filter = "invert(1) contrast(2) brightness(1.25)";

  let corruption = 0.95;

  const interval = setInterval(() => {
    badge.style.filter =
      Math.random() > .45
        ? "invert(1) contrast(2) brightness(1.25)"
        : "invert(1) contrast(1.4) brightness(.9)";

    badge.textContent = original
      .split("")
      .map((char) => {
        if (char === " ") return char;

        return Math.random() < corruption
          ? chars[Math.floor(Math.random() * chars.length)]
          : char;
      })
      .join("");

    corruption -= 0.09;

    if (corruption <= 0) {
      clearInterval(interval);
      badge.textContent = original;
      badge.style.filter = "";
    }
  }, 85);
}

function scheduleBadgeGlitch() {
  setTimeout(() => {

    glitchRandomBadge();

    setInterval(() => {

      if (!document.querySelector(".profile-card").classList.contains("glitching")) {
        glitchRandomBadge();
      }

    }, 10000);

  }, 5000);
}

function glitchTypingLine() {
  const target = document.getElementById("typingLine");
  if (!target) return;

  const messages = [
    "YOU ARE NOT ALONE_",
    "IT SEES YOU_",
    "DO NOT LOOK AWAY_",
    "WE HAVE BEEN WAITING_",
    "LOOK BEHIND YOU_"
  ];

  target.dataset.glitchPaused = "true";
  
  const original = target.textContent;
  
  target.textContent =
    messages[Math.floor(Math.random() * messages.length)];
  
  setTimeout(() => {
    target.textContent = original;
    target.dataset.glitchPaused = "false";
  }, 550);
}
function glitchProfileCard() {
  const card = document.querySelector(".profile-card");
  if (!card) return;

  card.classList.add("glitching");

  setTimeout(() => {
    card.classList.remove("glitching");
  }, 550);

  glitchAllText();
  glitchTypingLine();
}

window.addEventListener("load", () => {
  setTimeout(glitchProfileCard, 2000);
  setInterval(glitchProfileCard, 20000);
  scheduleBadgeGlitch();
});
