<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>𝔤𝔥𝔬𝔰𝔱</title>

  <link rel="icon" type="image/png" href="assets/header.png?v=3">
  <link rel="shortcut icon" type="image/png" href="assets/header.png?v=3">
  <link rel="apple-touch-icon" href="assets/header.png?v=3">

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Share+Tech+Mono&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/4b9ba14b0f.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="bg"></div>

  <main class="page">
    <section class="profile-card">
      <div class="top-row">
        <div class="avatar-wrap">
          <div class="decoration"></div>
          <img class="avatar" src="assets/avatar.jpg" alt="Discord profile picture" />
        </div>

        <div class="name-block">
          <h1 class="ghost-name">𝔤𝔥𝔬𝔰𝔱</h1>
          <div class="handle-row">
            <span>@digital.gh0st</span>
            <span class="server-badge">.XIII.</span>
          </div>
        </div>
      </div>

      <p class="center-line">
        <span id="typingLine"></span><span class="typing-cursor">|</span>
      </p>

      <div class="badges">
        <span>SHE/HER</span>
        <span>30+</span>
        <span>XIII CREATOR</span>
      </div>

      <nav class="links" aria-label="social links">
        <a href="https://steamcommunity.com/" target="_blank" rel="noopener noreferrer" aria-label="Steam"><i class="fa-brands fa-steam"></i></a>
        <a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://discord.gg/thirteen-xiii" target="_blank" rel="noopener noreferrer" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://throne.com/" target="_blank" rel="noopener noreferrer" aria-label="Throne"><i class="fa-solid fa-crown"></i></a>
      </nav>

      <section class="server-card">
        <img src="assets/XIII.gif" alt="XIII server icon" />
        <div class="server-info">
          <h2>.XIII. <span>21+</span></h2>
          <p><span class="online"></span>49 ONLINE <span class="divider"></span> 233 MEMBERS</p>
        </div>
        <a class="join" href="https://discord.gg/thirteen-xiii" target="_blank" rel="noopener noreferrer">JOIN</a>
      </section>

      <section class="music-player custom-player">
        <div class="cover" id="coverArt"></div>

        <div class="track">
          <div class="track-title" id="trackTitle">MODEL CITIZEN — MALE TEARS</div>

          <div class="player-controls">
            <button class="control-btn" id="prevBtn" type="button" aria-label="Previous song">
              <i class="fa-solid fa-backward-step"></i>
            </button>

            <button class="control-btn play-main" id="playBtn" type="button" aria-label="Play music">
              <i class="fa-solid fa-play"></i>
            </button>

            <button class="control-btn" id="nextBtn" type="button" aria-label="Next song">
              <i class="fa-solid fa-forward-step"></i>
            </button>

            <span class="time" id="currentTime">0:00</span>

            <input
              class="progress"
              id="progressBar"
              type="range"
              min="0"
              max="100"
              value="0"
              aria-label="Song progress"
            />

            <span class="time" id="duration">0:00</span>
          </div>

          <div class="track-list" id="trackList" aria-label="playlist"></div>

          <audio id="song" preload="metadata"></audio>
        </div>
      </section>
    </section>
  </main>

  <script>
    const phrases = [
      "WIFE · MOTHER · SPOOKY",
      "ARCHIVING THE STRANGE"
    ];

    const typingTarget = document.getElementById("typingLine");
    let phraseIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function typeLoop() {
      const currentPhrase = phrases[phraseIndex];

      if (!deleting) {
        typingTarget.textContent = currentPhrase.substring(0, charIndex);
        charIndex++;

        if (charIndex > currentPhrase.length) {
          deleting = true;
          setTimeout(typeLoop, 2000);
          return;
        }
      } else {
        typingTarget.textContent = currentPhrase.substring(0, charIndex);
        charIndex--;

        if (charIndex < 0) {
          deleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          setTimeout(typeLoop, 400);
          return;
        }
      }

      setTimeout(typeLoop, deleting ? 45 : 100);
    }

    typeLoop();
  </script>

  <script>
    const playlist = [
      {
        title: "MODEL CITIZEN — MALE TEARS",
        file: "assets/Model Citizen - Male Tears.mp3",
        cover: "assets/model citizen art.jpg"
      },
      {
        title: "MONOCHROME — BLCKBRD, SALIVA GREY",
        file: "assets/MONOCHROME - Blckbrd, Saliva Grey.mp3",
        cover: "assets/monochrome art.jpg"
      },
      {
        title: "MOONCHILD — FIELDS OF THE NEPHILIM",
        file: "assets/Moonchild - Fields Of The Nephilim.mp3",
        cover: "assets/moonchild art.jpg"
      }
    ];

    const song = document.getElementById("song");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const titleEl = document.getElementById("trackTitle");
    const coverArt = document.getElementById("coverArt");
    const trackList = document.getElementById("trackList");
    const playIcon = playBtn.querySelector("i");

    let currentTrack = 0;
    let isSeeking = false;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function setPlayIcon(isPlaying) {
      playIcon.classList.toggle("fa-play", !isPlaying);
      playIcon.classList.toggle("fa-pause", isPlaying);
    }

    function renderTrackList() {
      trackList.innerHTML = playlist.map((track, index) => {
        const active = index === currentTrack ? "active" : "";
        return `<button class="track-chip ${active}" type="button" data-index="${index}">${index + 1}</button>`;
      }).join("");
    }

    function loadTrack(index, autoplay = false) {
      currentTrack = index;
      const track = playlist[currentTrack];

      song.src = track.file;
      titleEl.textContent = track.title;
      coverArt.style.backgroundImage = `url('${track.cover}')`;
      progressBar.value = 0;
      progressBar.style.setProperty("--progress", "0%");
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";
      renderTrackList();

      if (autoplay) {
        song.play();
      } else {
        setPlayIcon(false);
      }
    }

    playBtn.addEventListener("click", () => {
      if (song.paused) {
        song.play();
      } else {
        song.pause();
      }
    });

    prevBtn.addEventListener("click", () => {
      const wasPlaying = !song.paused;
      const nextIndex = (currentTrack - 1 + playlist.length) % playlist.length;
      loadTrack(nextIndex, wasPlaying);
    });

    nextBtn.addEventListener("click", () => {
      const wasPlaying = !song.paused;
      const nextIndex = (currentTrack + 1) % playlist.length;
      loadTrack(nextIndex, wasPlaying);
    });

    trackList.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-index]");
      if (!button) return;
      const wasPlaying = !song.paused;
      loadTrack(Number(button.dataset.index), wasPlaying);
    });

    song.addEventListener("play", () => setPlayIcon(true));
    song.addEventListener("pause", () => setPlayIcon(false));

    song.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(song.duration);
    });

    song.addEventListener("timeupdate", () => {
      if (isSeeking) return;
      const percent = (song.currentTime / song.duration) * 100 || 0;
      progressBar.value = percent;
      progressBar.style.setProperty("--progress", `${percent}%`);
      currentTimeEl.textContent = formatTime(song.currentTime);
    });

    progressBar.addEventListener("input", () => {
      isSeeking = true;
      progressBar.style.setProperty("--progress", `${progressBar.value}%`);
    });

    progressBar.addEventListener("change", () => {
      song.currentTime = (progressBar.value / 100) * song.duration;
      isSeeking = false;
    });

    song.addEventListener("ended", () => {
      const nextIndex = (currentTrack + 1) % playlist.length;
      loadTrack(nextIndex, true);
    });

    loadTrack(0);
  </script>
</body>
</html>
