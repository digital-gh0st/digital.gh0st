<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ᴅɪɢɪᴛᴀʟ.ɢʜᴏsᴛ</title>

  <link rel="icon" type="image/png" href="assets/header.png?v=4">
  <link rel="shortcut icon" type="image/png" href="assets/header.png?v=4">
  <link rel="apple-touch-icon" href="assets/header.png?v=4">

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Share+Tech+Mono&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/4b9ba14b0f.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="bg"></div>

  <main class="page">
    <section class="profile-card">
      <div class="top-row">
        <div class="avatar-wrap">
          <div class="decoration"></div>
          <img class="avatar" src="assets/avatar.jpg" alt="Discord profile picture" />
          <span class="status-dot" title="Online"></span>
        </div>

        <div class="name-block">
          <h1 class="ghost-name" data-text="gh0st">gh0st</h1>
          <div class="handle-row">
            <span>@digital.gh0st</span>
            <span class="server-badge">.XIII.</span>
          </div>
        </div>
      </div>

      <p class="center-line">
        <span id="typingLine"></span><span class="typing-cursor">|</span>
      </p>

      <div class="badges">
        <span>SHE/HER</span>
        <span>30+</span>
        <span>XIII CREATOR</span>
        <span>DEVELOPER</span>
      </div>

      <nav class="links" aria-label="social links">
        <a href="https://steamcommunity.com/" aria-label="Steam" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-steam"></i></a>
        <a href="https://open.spotify.com/" aria-label="Spotify" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://x.com/" aria-label="X" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://discord.gg/thirteen-xiii" aria-label="Discord" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-discord"></i></a>
        <a href="https://throne.com/" aria-label="Throne" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-crown"></i></a>
      </nav>

      <section class="server-card">
        <img src="assets/XIII.gif" alt="XIII server icon" />
        <div class="server-info">
          <h2>.XIII. <span>21+</span></h2>
          <p><span class="online"></span>49 ONLINE <span class="divider"></span>233 MEMBERS</p>
        </div>
        <a class="join" href="https://discord.gg/thirteen-xiii" target="_blank" rel="noopener noreferrer">JOIN</a>
      </section>

      <section class="music-player">
        <div class="asset/music.png"></div>
        <div class="track">
          <div class="track-title">MALE TEARS - MODEL CITIZEN</div>
          <audio controls preload="metadata">
            <source src="assets/song.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
          </audio>
        </div>
      </section>
    </section>
  </main>

  <script>
    const phrases = [
      "WIFE · MOTHER · SPOOKY",
      "ARCHIVING THE STRANGE"
    ];

    const target = document.getElementById("typingLine");

    let phraseIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function typeLoop() {
      const currentPhrase = phrases[phraseIndex];

      if (!deleting) {
        target.textContent = currentPhrase.substring(0, charIndex);
        charIndex++;

        if (charIndex > currentPhrase.length) {
          deleting = true;
          setTimeout(typeLoop, 2000);
          return;
        }
      } else {
        target.textContent = currentPhrase.substring(0, charIndex);
        charIndex--;

        if (charIndex < 0) {
          deleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          setTimeout(typeLoop, 400);
          return;
        }
      }

      setTimeout(typeLoop, deleting ? 45 : 100);
    }

    typeLoop();
  </script>
</body>
</html>
