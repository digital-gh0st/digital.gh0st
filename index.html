<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>digital-gh0st</title>
  <link rel="icon" type="image/png" href="assets/header.png">

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Share+Tech+Mono&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/4b9ba14b0f.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="bg"></div>

  <main class="page">
    <section class="profile-card">

      <div class="top-row">
        <div class="avatar-wrap">
          <div class="decoration"></div>
          <img class="avatar" src="assets/avatar.jpg" alt="Discord profile picture" />
          <span class="status-dot" title="Online"></span>
        </div>

        <div class="name-block">
          <canvas id="ghostName" width="240" height="80" aria-label="gh0st"></canvas>

          <div class="handle-row">
            <span>@digital.gh0st</span>
            <span class="server-badge">.XIII.</span>
          </div>
        </div>
      </div>

      <p class="center-line">WIFE · MOTHER · SPOOKY</p>

      <div class="badges">
        <span>SHE/HER</span>
        <span>30+</span>
        <span>XIII CREATOR</span>
        <span>DEVELOPER</span>
      </div>

      <nav class="links" aria-label="social links">
        <a href="https://steamcommunity.com/" aria-label="Steam"><i class="fa-brands fa-steam"></i></a>
        <a href="https://open.spotify.com/" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://x.com/" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://discord.gg/" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://throne.com/" aria-label="Throne"><i class="fa-solid fa-crown"></i></a>
      </nav>

      <section class="server-card">
        <img src="assets/avatar.jpg" alt="XIII server icon" />
        <div class="server-info">
          <h2>.XIII. <span>21+</span></h2>
          <p><span class="online"></span>49 ONLINE <span class="divider"></span> 233 MEMBERS</p>
        </div>
        <a class="join" href="https://discord.gg/">JOIN</a>
      </section>

      <section class="music-player">
        <div class="cover"></div>
        <div class="track">
          <div class="track-title">MALE TEARS</div>
          <audio controls preload="metadata">
            <source src="assets/song.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
          </audio>
        </div>
      </section>

    </section>
  </main>

  <script>
    const canvas = document.getElementById("ghostName");
    const ctx = canvas.getContext("2d");

    function drawFuzzyName() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const text = "𝔤𝔥𝔬𝔰𝔱";

      ctx.textBaseline = "middle";
      ctx.font = "52px UnifrakturMaguntia, serif";
      ctx.fillStyle = "#ffffff";

      for (let i = 0; i < 9; i++) {
        ctx.globalAlpha = 0.18;
        ctx.fillText(
          text,
          8 + (Math.random() * 3 - 1.5),
          42 + (Math.random() * 3 - 1.5)
        );
      }

      ctx.globalAlpha = 1;
      ctx.fillText(text, 8, 42);
    }

    drawFuzzyName();
    setInterval(drawFuzzyName, 120);
  </script>
</body>
</html>
