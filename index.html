<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ᴅɪɢɪᴛᴀʟ.ɢʜᴏsᴛ</title>

  <!-- Bat tab icon -->
  <link rel="icon" type="image/png" href="assets/header.png?v=2">
  <link rel="shortcut icon" type="image/png" href="assets/header.png?v=2">
  <link rel="apple-touch-icon" href="assets/header.png?v=2">

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Share+Tech+Mono&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/4b9ba14b0f.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="bg"></div>

  <main class="page">
    <section class="profile-card">
      <div class="top-row">
        <div class="avatar-wrap">
          <div class="decoration"></div>
          <img class="avatar" src="assets/avatar.jpg" alt="Discord profile picture" />
          <span class="status-dot" title="Online"></span>
        </div>

        <div class="name-block">
         <h1 class="ghost-name" data-text="gh0st">gh0st</h1>
          <div class="handle-row">
            <span>@digital.gh0st</span>
            <span class="server-badge">.XIII.</span>
          </div>
        </div>
      </div>

      <p class="center-line">
        <span id="typingLine"></span><span class="typing-cursor">|</span>
      </p>

      <div class="badges">
        <span>SHE/HER</span>
        <span>30+</span>
        <span>XIII CREATOR</span>
        <span>DEVELOPER</span>
      </div>

      <nav class="links" aria-label="social links">
        <a href="https://steamcommunity.com/" aria-label="Steam"><i class="fa-brands fa-steam"></i></a>
        <a href="https://open.spotify.com/" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://x.com/" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://discord.gg/" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://throne.com/" aria-label="Throne"><i class="fa-solid fa-crown"></i></a>
      </nav>

      <section class="server-card">
        <img src="assets/XIII.gif" alt="XIII server icon" />
        <div class="server-info">
          <h2>.XIII. <span>21+</span></h2>
          <p><span class="online"></span>49 ONLINE <span class="divider"></span> 233 MEMBERS</p>
        </div>
        <a class="join" href="https://discord.gg/thirteen-xiii" target="_blank" rel="noopener noreferrer">JOIN</a>
      </section>

      <section class="music-player custom-player">
        <div class="cover"></div>
        <div class="track">
          <div class="track-title">MODEL CITIZEN <span>—</span> MALE TEARS</div>

          <div class="player-controls">
            <button class="play-btn" id="playBtn" type="button" aria-label="Play music">
              <i class="fa-solid fa-play"></i>
            </button>

            <span class="time" id="currentTime">0:00</span>

            <input
              class="progress"
              id="progressBar"
              type="range"
              min="0"
              max="100"
              value="0"
              aria-label="Song progress"
            />

            <span class="time" id="duration">4:48</span>
          </div>

          <audio id="song" preload="metadata">
            <source src="assets/song.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
          </audio>
        </div>
      </section>
    </section>
  </main>

<script>
  const phrases = [
    "WIFE · MOTHER · SPOOKY",
    "ARCHIVING THE STRANGE"
  ];

  const target = document.getElementById("typingLine");

  let phraseIndex = 0;
  let charIndex = 0;
  let deleting = false;

  function typeLoop() {
    const currentPhrase = phrases[phraseIndex];

    if (!deleting) {
      target.textContent = currentPhrase.substring(0, charIndex);
      charIndex++;

      if (charIndex > currentPhrase.length) {
        deleting = true;
        setTimeout(typeLoop, 2000);
        return;
      }
    } else {
      target.textContent = currentPhrase.substring(0, charIndex);
      charIndex--;

      if (charIndex < 0) {
        deleting = false;
        phraseIndex = (phraseIndex + 1) % phrases.length;
        setTimeout(typeLoop, 400);
        return;
      }
    }

    setTimeout(typeLoop, deleting ? 45 : 100);
  }

  typeLoop();
</script>
  <script>
    const song = document.getElementById("song");
    const playBtn = document.getElementById("playBtn");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const playIcon = playBtn.querySelector("i");

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    song.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(song.duration);
    });

    playBtn.addEventListener("click", () => {
      if (song.paused) {
        song.play();
        playIcon.classList.remove("fa-play");
        playIcon.classList.add("fa-pause");
      } else {
        song.pause();
        playIcon.classList.remove("fa-pause");
        playIcon.classList.add("fa-play");
      }
    });

    song.addEventListener("timeupdate", () => {
      const percent = (song.currentTime / song.duration) * 100 || 0;
      progressBar.value = percent;
      progressBar.style.setProperty("--progress", `${percent}%`);
      currentTimeEl.textContent = formatTime(song.currentTime);
    });

    progressBar.addEventListener("input", () => {
      song.currentTime = (progressBar.value / 100) * song.duration;
      progressBar.style.setProperty("--progress", `${progressBar.value}%`);
    });

    song.addEventListener("ended", () => {
      playIcon.classList.remove("fa-pause");
      playIcon.classList.add("fa-play");
      progressBar.value = 0;
      currentTimeEl.textContent = "0:00";
    });
  </script>

</body>
</html>
