  <script>
    const phrases = ["WIFE · MOTHER · SPOOKY", "ARCHIVING THE STRANGE"];
    const typingTarget = document.getElementById("typingLine");
    let phraseIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function typeLoop() {
      const phrase = phrases[phraseIndex];

      if (!deleting) {
        typingTarget.textContent = phrase.substring(0, charIndex);
        charIndex++;

        if (charIndex > phrase.length) {
          deleting = true;
          setTimeout(typeLoop, 1900);
          return;
        }
      } else {
        typingTarget.textContent = phrase.substring(0, charIndex);
        charIndex--;

        if (charIndex < 0) {
          deleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          setTimeout(typeLoop, 350);
          return;
        }
      }

      setTimeout(typeLoop, deleting ? 45 : 95);
    }
    typeLoop();

    const playlist = [
      {
        title: "MODEL CITIZEN — MALE TEARS",
        file: "assets/Model Citizen - Male Tears.mp3",
        cover: "assets/model citizen art.jpg"
      },
      {
        title: "МОНОХРОМ — SENSI AFFECT, CHERNOBURKV",
        file: "assets/МОНОХРОМ - Sensi Affect, Chernoburkv.mp3",
        cover: "assets/monochrome art.jpg"
      },
      {
        title: "MOONCHILD — FIELDS OF THE NEPHILIM",
        file: "assets/Moonchild - Fields Of The Nephilim.mp3",
        cover: "assets/moonchild art.jpg"
      }
    ];

    const audio = document.getElementById("audioPlayer");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const title = document.getElementById("trackTitle");
    const cover = document.getElementById("songCover");
    const progress = document.getElementById("progressBar");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");
    let currentTrack = 0;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${min}:${sec}`;
    }

    function loadTrack(index) {
      const track = playlist[index];
      audio.src = track.file;
      title.textContent = track.title;
      cover.src = track.cover;
      progress.value = 0;
      currentTime.textContent = "0:00";
      duration.textContent = "0:00";
      playBtn.textContent = "▶";
    }

    function playTrack() {
      audio.play();
      playBtn.textContent = "❚❚";
    }

    function pauseTrack() {
      audio.pause();
      playBtn.textContent = "▶";
    }

    playBtn.addEventListener("click", () => {
      audio.paused ? playTrack() : pauseTrack();
    });

    nextBtn.addEventListener("click", () => {
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      playTrack();
    });

    prevBtn.addEventListener("click", () => {
      currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrack);
      playTrack();
    });

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      progress.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      currentTime.textContent = formatTime(audio.currentTime);
    });

    progress.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (progress.value / 100) * audio.duration;
      }
    });

    audio.addEventListener("ended", () => {
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      playTrack();
    });

    loadTrack(currentTrack);
  </script>

  <script>
async function updateDiscordStats() {
  try {
    const response = await fetch(
      "https://discord.com/api/v9/invites/thirteen-xiii?with_counts=true"
    );

    const data = await response.json();

    document.getElementById("onlineCount").textContent =
      data.approximate_presence_count || "--";

    document.getElementById("memberCount").textContent =
      data.approximate_member_count || "--";

  } catch (err) {
    console.error("Discord stats failed:", err);
  }
}

updateDiscordStats();
setInterval(updateDiscordStats, 60000);
</script>
